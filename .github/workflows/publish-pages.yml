name: Publish ARCADE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arcade-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/build_pages.py
      - name: Install browser chess rules
        run: |
          mkdir -p site/static/vendor
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js -o site/static/vendor/chess.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/chess.js@1.4.0/LICENSE -o site/static/vendor/chess.LICENSE
          test -s site/static/vendor/chess.js
          for game in dino tetris chess; do test -s "site/play/$game/index.html"; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
